# Manually promote a commit that's already been built (and deployed to
# staging) to production. Uses the exact image CI built; nothing is rebuilt.
#
# Run from the Actions tab, or: gh workflow run promote.yml -f sha=<commit>
name: Promote to production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to promote (full or short SHA; must be on master)
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Add required reviewers to this environment in GitHub to gate promotion.
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: resolve
        name: Resolve and verify commit
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          sha=$(git rev-parse --verify "${INPUT_SHA}^{commit}")
          if ! git merge-base --is-ancestor "$sha" origin/master; then
            echo "::error::$sha is not on master"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      # Retagging fails if no image was built for this commit.
      - uses: ./.github/actions/render-deploy
        with:
          image: ${{ steps.resolve.outputs.image }}
          sha: ${{ steps.resolve.outputs.sha }}
          environment: production
          deploy-hook-url: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          app-url: ${{ vars.APP_URL }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
