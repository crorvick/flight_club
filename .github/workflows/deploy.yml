# On every push to master: run checks, build the image once, push it to
# GHCR tagged with the commit SHA, and deploy that image to staging.
name: Deploy to staging

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  image:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - id: name
        # GHCR image names must be lowercase.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/render-deploy
        with:
          image: ${{ needs.image.outputs.image }}
          sha: ${{ github.sha }}
          environment: staging
          deploy-hook-url: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          app-url: ${{ vars.APP_URL }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
