# On every push to master: run checks, build the image once, push it to
# the DigitalOcean Container Registry tagged with the commit SHA, and
# deploy that image to staging.
name: Deploy to staging

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  image:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          password: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          push: true
          tags: registry.digitalocean.com/${{ vars.DO_REGISTRY }}/flight-club:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/do-deploy
        with:
          app-id: ${{ vars.DO_APP_ID }}
          sha: ${{ github.sha }}
          app-url: ${{ vars.APP_URL }}
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
