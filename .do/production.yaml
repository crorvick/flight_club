# DigitalOcean App Platform spec for production.  Used once, to create the
# app (see docs/deploy.md).  After that the deploy workflow changes only
# the image tag on the app's live spec, so settings made in the dashboard,
# such as secrets, survive deploys.
name: flight-club-production
region: nyc

services:
  - name: web
    image:
      registry_type: DOCR
      repository: flight-club
      tag: REPLACE_WITH_SHA
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/health
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: BETTER_AUTH_URL
        scope: RUN_TIME
        value: ${APP_URL}
      # Replace before creating the app, with `openssl rand -base64 32`.
      # The placeholder is too short to pass validation, so the app fails
      # its health check rather than run with a guessable secret.
      - key: BETTER_AUTH_SECRET
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_WITH_SECRET

jobs:
  # Runs before each deploy; if it fails, the deploy is aborted and the
  # previous version keeps serving.
  - name: migrate
    kind: PRE_DEPLOY
    image:
      registry_type: DOCR
      repository: flight-club
      tag: REPLACE_WITH_SHA
    instance_size_slug: apps-s-1vcpu-0.5gb
    run_command: node scripts/migrate.mts
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}

databases:
  # A managed cluster, created separately (see docs/deploy.md), with daily
  # backups and point-in-time recovery.
  - name: db
    engine: PG
    production: true
    cluster_name: flight-club-production-db
    db_name: flightclub
    db_user: flightclub
